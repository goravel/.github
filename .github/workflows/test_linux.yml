name: Test
on:
  workflow_call:
jobs:
  ubuntu:
    strategy:
      matrix:
        go: [ "1.26", "1.27" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
      - name: Install dependencies
        run: go mod tidy
      - name: Run tests
        run: go test -timeout 10m ./...
